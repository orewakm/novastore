# Local SQL Server 2022 for the NovaStore project; connect to localhost,1433 as sa.
services:
    mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        platform: linux/amd64
        environment:
            ACCEPT_EULA: 'Y'
            MSSQL_SA_PASSWORD: 'NovaStore_2026!'
        ports:
            - '127.0.0.1:1433:1433'
        volumes:
            - mssql_data:/var/opt/mssql
            - ./yedek:/Yedek
        healthcheck:
            test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s

volumes:
    mssql_data:
